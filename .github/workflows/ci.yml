# The gate that did not exist.
#
# Three defects reached PyPI — `twine` as a runtime dependency, `__version__`
# stuck at 0.1.5 across four releases, and a sentencepiece range that permits a
# version which cannot load the bundled model. The repository had exactly one
# workflow, `release.yml`, which built and published on any `v*` tag with no test
# run, no lint, and no Python matrix. Nothing could have caught any of them.
#
# This runs on every push and pull request, and `release.yml` now waits on it.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Called by release.yml so a tag cannot publish without this passing.
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The package claims 3.11+ and was never tested on any of them. The
        # matrix is the point: a C-extension dependency like sentencepiece is
        # exactly where per-version wheel availability breaks.
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - run: uv sync --all-extras
      - name: lint
        run: |
          uv run ruff format --check .
          uv run ruff check .
      - name: types
        run: uv run mypy
      - name: tests
        run: uv run pytest

  # Separate job: it builds a wheel and inspects it, which is a different kind of
  # failure from a logic bug and should be readable as such in the checks list.
  artifact:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          enable-cache: true
      - run: uv build --no-sources
      - name: the model must be in the wheel
        # It ships because uv_build includes the module directory by default, not
        # because anything asked for it. This is the check that makes that
        # dependency explicit rather than incidental.
        run: |
          python - <<'PY'
          import sys, zipfile, glob
          wheels = glob.glob("dist/*.whl")
          assert wheels, "no wheel was produced"
          with zipfile.ZipFile(wheels[0]) as z:
              hits = [n for n in z.namelist() if n.endswith("mon_tokenizer.json")]
              assert hits, f"model missing from wheel: {z.namelist()}"
              size = z.getinfo(hits[0]).file_size
              assert size > 4_000_000, f"artifact in wheel is {size} bytes, expected ~4.8MB"
              cards = [n for n in z.namelist() if n.endswith("model_card.json")]
              assert cards, "model_card.json must ship beside the artifact"
          print(f"ok: {hits[0]} ({size:,} bytes)")
          PY
      - name: the wheel installs and loads its own model
        # Installing from the built artifact into a clean environment is the only
        # way to test what a user actually receives. `--no-project` keeps the
        # source tree off sys.path so a missing data file cannot be masked by it.
        run: |
          uv run --isolated --no-project --with dist/*.whl python -c "
          from mon_tokenizer import MonTokenizer
          t = MonTokenizer()
          assert t.get_vocab_size() == 64256, t.get_vocab_size()
          r = t.encode('ဂွံအခေါင်အရာမွဲ')
          assert t.decode_ids(r['ids']) == r['text']
          print('ok:', t)
          "

  # The check that was a thing someone remembered to do.
  #
  # This repository builds the artifact; `janakhpon/mon_tokenizer` on the Hub is
  # what `AutoTokenizer.from_pretrained` actually downloads. They are two copies
  # of one file pushed by two different commands. A release once shipped a
  # `tokenizer.json` there that was the 4,000-piece predecessor while the card
  # advertised 32,000 — users got 0.93 chars/token against an advertised 5.22, and
  # nothing caught it but a user.
  #
  # `hf_mon_tokenizer/NEXT_STEPS.md` carried "make the identity check automatic"
  # as its single open item, and asked for it here rather than there: a divergence
  # should fail the build in the repository that can fix it.
  #
  # `tests/test_artifact_sync.py` pins the same digest offline. This job is the
  # half that test cannot do — it reads the bytes the Hub is serving right now,
  # which is the only copy users get.
  artifact-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: the published artifact must be the packaged artifact
        run: |
          python - <<'PY'
          import ast, hashlib, json, pathlib, sys, time
          import urllib.error, urllib.request

          REPO = "janakhpon/mon_tokenizer"
          LOCAL = pathlib.Path("src/mon_tokenizer/data/mon_tokenizer.json")

          def sha256_file(path):
              digest = hashlib.sha256()
              with path.open("rb") as handle:
                  for block in iter(lambda: handle.read(1 << 20), b""):
                      digest.update(block)
              return digest.hexdigest()

          # One source of truth for the expected digest: the table the test suite
          # pins. Repeating the hash in YAML would be a second copy of one fact,
          # which is the exact shape of every defect this file guards against.
          tree = ast.parse(pathlib.Path("tests/test_artifact_sync.py").read_text(encoding="utf-8"))
          digests = next(
              ast.literal_eval(node.value)
              for node in ast.walk(tree)
              if isinstance(node, ast.Assign)
              and any(getattr(t, "id", "") == "ARTIFACT_DIGESTS" for t in node.targets)
          )
          card = json.loads((LOCAL.parent / "model_card.json").read_text(encoding="utf-8"))
          version = card["artifact_version"]
          if version not in digests:
              print(f"::error::artifact_version {version!r} has no row in ARTIFACT_DIGESTS")
              sys.exit(1)
          expected = digests[version]

          packaged = sha256_file(LOCAL)
          if packaged != expected:
              print(f"::error::packaged artifact is {packaged}, expected {expected}")
              sys.exit(1)
          print(f"packaged {version}: {packaged}")

          # Retried, then fatal. A Hub outage making this red is honest — the
          # property is unverified and saying so beats a green tick that means
          # "we did not look". A check that quietly skips is the failure mode this
          # job exists to remove.
          url = f"https://huggingface.co/{REPO}/resolve/main/tokenizer.json"
          published = last_error = None
          for attempt in range(1, 4):
              try:
                  request = urllib.request.Request(url, headers={"User-Agent": "mon-tokenizer-ci"})
                  with urllib.request.urlopen(request, timeout=120) as response:
                      digest = hashlib.sha256()
                      for block in iter(lambda: response.read(1 << 20), b""):
                          digest.update(block)
                      published = digest.hexdigest()
                  break
              except (urllib.error.URLError, TimeoutError, OSError) as exc:
                  last_error = exc
                  print(f"attempt {attempt}/3 failed: {exc}")
                  time.sleep(5 * attempt)

          if published is None:
              print(f"::error::could not read {url} after 3 attempts: {last_error}")
              sys.exit(1)
          print(f"published    : {published}")

          if published != packaged:
              print(
                  f"::error::the Hub is serving a DIFFERENT tokenizer. "
                  f"{REPO} has {published}, this repository ships {packaged}. "
                  f"Publish from this repository so the artifact and its card move "
                  f"in one commit; do not hand-edit files on the Hub."
              )
              sys.exit(1)
          print(f"ok: {REPO} is byte-identical to the packaged artifact")
          PY
